name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      # No default: a stale one once rebuilt main under an old version's name.
      # The version comes from the tag, and the build from the tag's commit.
      release_tag:
        description: Tag of the existing GitHub Release to rebuild (e.g. v0.2.4-alpha.4)
        required: true

permissions:
  contents: write

jobs:
  # Settles what is being released before anything is created, deleted or
  # built: the tag, its version, and the exact commit every later job uses.
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a release tag (vMAJOR.MINOR.PATCH, optionally -alpha.N or -beta.N)"
            exit 1
          fi
          # Stable releases reach every user, so they ship only what main has.
          # Pre-releases may come from any branch; alphas ship from feature branches.
          if [[ "$TAG" != *-* ]] && ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is a stable tag, but $(git rev-parse --short HEAD) is not on main"
            exit 1
          fi
          # A rebuild has nowhere to put its assets without the Release.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-release:
    needs: resolve-tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog from tag
        run: git tag -l --format='%(contents)' ${{ github.ref_name }} > /tmp/changelog.md

      - name: Delete existing release if any
        run: gh release delete ${{ github.ref_name }} --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        run: |
          PRERELEASE=()
          if [[ "${{ github.ref_name }}" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes-file /tmp/changelog.md --draft "${PRERELEASE[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: [resolve-tag, create-release]
    if: >-
      always() &&
      needs.resolve-tag.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.create-release.result == 'success')
    runs-on: macos-26
    steps:
      # The commit resolve-tag checked, not whatever the branch or tag points
      # at by now: the build must be exactly the release it is labelled as.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.sha }}

      - name: Resolve release metadata
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      # Before the signing certificate is on the runner. Same step as ci.yml.
      - name: Test native shared data and widget routing
        run: xcrun swift test

      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/inklet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          CERTIFICATE_DATA="$CSC_LINK"
          if [[ "$CERTIFICATE_DATA" == *,* ]]; then
            CERTIFICATE_DATA="${CERTIFICATE_DATA#*,}"
          fi
          CERTIFICATE_DATA="${CERTIFICATE_DATA#base64:}"
          printf '%s' "$CERTIFICATE_DATA" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          MAC_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)"
          test -n "$MAC_SIGN_IDENTITY"
          echo "MAC_SIGN_IDENTITY=$MAC_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build native universal app
        env:
          INKLET_ARCHS: arm64,x86_64
          INKLET_BUILD_NUMBER: ${{ github.run_number }}
          INKLET_RELEASE: 1
        run: |
          export INKLET_VERSION="$RELEASE_VERSION"
          export INKLET_SIGN_IDENTITY="$MAC_SIGN_IDENTITY"
          ./Scripts/build-app.sh release

      - name: Create signed disk image
        run: |
          export INKLET_VERSION="$RELEASE_VERSION"
          export INKLET_SIGN_IDENTITY="$MAC_SIGN_IDENTITY"
          ./Scripts/package-dmg.sh

      - name: Decode notarization key
        env:
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$APPLE_API_KEY_VALUE" | base64 --decode > "$KEY_PATH" || true
          if ! head -n1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$APPLE_API_KEY_VALUE" > "$KEY_PATH"
          fi
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="dist/inklet-portal-$RELEASE_VERSION-mac-universal.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          cp "$DMG" dist/inklet-portal-macOS.dmg

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          SPARKLE_BIN="$(find .build/artifacts -type d -path '*sparkle/Sparkle/bin' | head -n1)"
          test -x "$SPARKLE_BIN/generate_appcast"

          WORK="$RUNNER_TEMP/appcast"
          mkdir -p "$WORK"
          # Start from the published feed so earlier items survive; a first
          # release has no branch yet and starts an empty feed.
          if git fetch origin appcast 2>/dev/null; then
            git show origin/appcast:appcast.xml > "$WORK/appcast.xml"
          fi
          DMG_NAME="inklet-portal-$RELEASE_VERSION-mac-universal.dmg"
          cp "dist/$DMG_NAME" "$WORK/"
          # The annotated tag message doubles as the release notes.
          git fetch --tags --force >/dev/null 2>&1 || true
          git tag -l --format='%(contents)' "$RELEASE_TAG" > "$WORK/${DMG_NAME%.dmg}.md"

          CHANNEL=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then CHANNEL=(--channel beta); fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/inklethq/app/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/inklethq/app/releases" \
            --embed-release-notes \
            "${CHANNEL[@]}" \
            "$WORK"
          cp "$WORK/appcast.xml" dist/appcast.xml
          cat dist/appcast.xml

      - name: Upload native macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/inklet-portal-$RELEASE_VERSION-mac-universal.dmg" \
            dist/inklet-portal-macOS.dmg \
            dist/appcast.xml \
            --clobber

      - name: Publish appcast to the appcast branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin appcast 2>/dev/null; then
            git worktree add -B appcast "$RUNNER_TEMP/appcast-branch" origin/appcast
          else
            git worktree add --orphan -b appcast "$RUNNER_TEMP/appcast-branch"
          fi
          cp dist/appcast.xml "$RUNNER_TEMP/appcast-branch/appcast.xml"
          cd "$RUNNER_TEMP/appcast-branch"
          git add appcast.xml
          git commit -m "appcast: $RELEASE_TAG" || echo "appcast unchanged"
          git push origin appcast

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true

  publish-release:
    needs: build-mac
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git cat-file -p ${{ github.ref_name }} | sed '1,/^$/d' > /tmp/changelog.md
          gh release edit ${{ github.ref_name }} --notes-file /tmp/changelog.md --draft=false
