name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging scripts
        run: |
          bash -n Scripts/build-app.sh
          bash -n Scripts/build-widgets.sh
          bash -n Scripts/widget-configuration.sh
          bash -n Scripts/package-dmg.sh

      - name: Test native shared data and widget routing
        run: xcrun swift test

      - name: Package universal app and WidgetKit extension
        env:
          INKLET_ARCHS: arm64,x86_64
        run: ./Scripts/build-app.sh release
