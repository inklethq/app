name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging scripts
        run: |
          bash -n macos/Scripts/build-app.sh
          bash -n macos/Scripts/build-widgets.sh
          bash -n macos/Scripts/widget-configuration.sh
          bash -n macos/Scripts/package-dmg.sh

      - name: Test native shared data and widget routing
        working-directory: macos
        run: xcrun swift test

      - name: Package universal app and WidgetKit extension
        env:
          INKLET_ARCHS: arm64,x86_64
        run: ./macos/Scripts/build-app.sh release
